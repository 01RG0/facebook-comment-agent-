[build]
builder = "NIXPACKS"

[[services]]
name = "web"
source = "."

[services.build]
buildCommand = "npm run build"

[services.deploy]
startCommand = "npm run start"
healthcheckPath = "/api/health"
healthcheckTimeout = 30

[[services]]
name = "worker"
source = "."

[services.deploy]
startCommand = "npm run worker:prod"

[[services]]
name = "monitor"
source = "."

[services.deploy]
startCommand = "npm run monitor:prod"
